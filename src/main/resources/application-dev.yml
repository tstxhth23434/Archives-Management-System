server:
  port: 8080

spring:
  datasource:
    type: com.zaxxer.hikari.HikariDataSource
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3306/document_management_system?useUnicode=true&characterEncoding=utf-8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
    username: root
    password: root
    hikari:
      # 连接池名
      pool-name: DMS-HikariCP
      # 最小空闲连接数
      minimum-idle: 5
      # 最大连接数
      maximum-pool-size: 20
      # 连接空闲超时时间（毫秒）
      idle-timeout: 600000
      # 连接最大生命周期（毫秒）
      max-lifetime: 1800000
      # 连接超时时间（毫秒）
      connection-timeout: 30000
      # 连接测试语句
      connection-test-query: SELECT 1

  # Redis 缓存（字典缓存方案A）
  redis:
    host: localhost
    port: 6379
    # 本机 Redis 密码（换电脑需同步本机 Redis 的 requirepass 配置）
    password: tlkj@admin123!
    database: 0
    # 连接超时（毫秒）
    timeout: 5000
    lettuce:
      pool:
        # 最大连接数
        max-active: 8
        # 最大空闲连接数
        max-idle: 8
        # 最小空闲连接数
        min-idle: 0
        # 获取连接最大等待时间
        max-wait: -1ms

# Knife4j 接口文档（开发环境启用）
knife4j:
  enable: true
  setting:
    # 是否显示文档页
    enableSwaggerModels: true
    # 文档标题
    title: 档案管理系统 API 文档
    # 文档描述
    description: Document Management System - 毕业设计项目
    # 版本号
    version: v1.0.0
    # 联系人
    contact:
      name: 开发者
      url: ""
      email: ""
